<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kakwa Dispatch — Plan the shift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%231e4d3a' width='32' height='32' rx='6'/%3E%3Cpath fill='%23f6c445' d='M8 20h16l-2 4H10zm2-3h12l-1.2-6H11.2z'/%3E%3C/svg%3E" />
  </head>
  <body x-data x-cloak>
    <div class="shell">
      <header class="top">
        <p class="mark">Kakwa</p>
        <div>
          <p class="product">Dispatch</p>
          <p class="demo-note">Quinn · plan the shift. Sample data. Resets on refresh.</p>
        </div>
      </header>

      <p class="banner" role="alert" x-show="$store.demo.notice" x-text="$store.demo.notice"></p>

      <template x-if="$store.demo.screen === 'plan'">
      <section class="screen" aria-labelledby="plan-heading">
        <div class="screen-h">
          <h1 id="plan-heading">Tonight's plan</h1>
          <p>Steps run in order. Sites in the same step run at the same time.</p>
        </div>
        <p class="empty" x-show="!$store.demo.plan.length">No sites yet. Add the first stop.</p>
        <ol class="steps">
          <template x-for="(step, stepIndex) in $store.demo.plan" :key="step.id">
            <li class="step">
              <p class="step-k" x-text="'Step ' + (stepIndex + 1)"></p>
              <template x-for="(stop, siteIndex) in step.sites" :key="stop.id">
                <article class="card">
                  <h2 x-text="$store.demo.site(stop.siteId).name"></h2>
                  <p class="muted" x-text="$store.demo.site(stop.siteId).address"></p>
                  <div class="tags">
                    <template x-for="service in $store.demo.site(stop.siteId).services" :key="service">
                      <span class="tag" :class="'tag-' + service" x-text="service"></span>
                    </template>
                  </div>
                  <ul class="crew">
                    <template x-for="seat in stop.crew" :key="seat.machineId">
                      <li>
                        <strong x-text="$store.demo.machine(seat.machineId).name"></strong>
                        <span x-text="$store.demo.machine(seat.machineId).detail"></span>
                        <span x-text="$store.demo.operatorName(seat.operatorId)"></span>
                      </li>
                    </template>
                  </ul>
                  <div class="arrows">
                    <button type="button" @click="$store.demo.moveSite(stepIndex, siteIndex, -1)" :disabled="!$store.demo.canMove(stepIndex, siteIndex, -1)" :aria-label="'Move ' + $store.demo.site(stop.siteId).name + ' earlier'">Up</button>
                    <button type="button" @click="$store.demo.moveSite(stepIndex, siteIndex, 1)" :disabled="!$store.demo.canMove(stepIndex, siteIndex, 1)" :aria-label="'Move ' + $store.demo.site(stop.siteId).name + ' later'">Down</button>
                  </div>
                </article>
              </template>
            </li>
          </template>
        </ol>
        <button type="button" class="primary" @click="$store.demo.startPlan()">Add a site</button>
      </section>
      </template>

      <template x-if="$store.demo.screen === 'site'">
      <section class="screen" aria-labelledby="site-heading">
        <button type="button" class="back" @click="$store.demo.back()">Back to plan</button>
        <div class="screen-h">
          <p class="kicker">1 · Site</p>
          <h1 id="site-heading">Which site is next?</h1>
        </div>
        <div class="stack">
          <template x-for="site in $store.demo.sites" :key="site.id">
            <button
              type="button"
              class="tap"
              @click="$store.demo.pickSite(site.id)"
              :disabled="$store.demo.siteInPlan(site.id)"
            >
              <span class="tap-title" x-text="site.name"></span>
              <span class="muted" x-text="site.address"></span>
              <span class="tags">
                <template x-for="service in site.services" :key="service">
                  <span class="tag" :class="'tag-' + service" x-text="service"></span>
                </template>
              </span>
              <span class="muted" x-show="$store.demo.siteInPlan(site.id)">Already in the plan</span>
            </button>
          </template>
        </div>
      </section>
      </template>

      <template x-if="$store.demo.screen === 'when'">
      <section class="screen" aria-labelledby="when-heading">
        <button type="button" class="back" @click="$store.demo.back()">Back</button>
        <div class="screen-h">
          <p class="kicker">2 · Timing</p>
          <h1 id="when-heading" x-text="$store.demo.draftSite().name"></h1>
          <p>Does this site run at the same time as the current step, or after it?</p>
        </div>
        <div class="stack">
          <button type="button" class="tap" @click="$store.demo.pickWhen('alongside')">
            <span class="tap-title" x-text="'Alongside step ' + $store.demo.plan.length"></span>
            <span class="muted">Same time. It needs machines that are not already busy.</span>
          </button>
          <button type="button" class="tap" @click="$store.demo.pickWhen('after')">
            <span class="tap-title">After the current step</span>
            <span class="muted">A new step. Machines can move on from an earlier site.</span>
          </button>
        </div>
      </section>
      </template>

      <template x-if="$store.demo.screen === 'machines'">
      <section class="screen" aria-labelledby="machines-heading">
        <button type="button" class="back" @click="$store.demo.back()">Back</button>
        <div class="screen-h">
          <p class="kicker">3 · Machines</p>
          <h1 id="machines-heading" x-text="$store.demo.draftSite().name"></h1>
          <p>Tap every machine this site needs. Only a matching service can be chosen.</p>
        </div>
        <div class="stack">
          <template x-for="machine in $store.demo.machines" :key="machine.id">
            <button
              type="button"
              class="tap"
              :class="{ 'is-on': $store.demo.draft.machineIds.includes(machine.id) }"
              @click="$store.demo.toggleMachine(machine.id)"
              :disabled="$store.demo.machineChoice(machine.id).state === 'unneeded' || $store.demo.machineChoice(machine.id).state === 'taken'"
            >
              <span class="tap-title" x-text="machine.name + ' · ' + machine.detail"></span>
              <span class="tags"><span class="tag" :class="'tag-' + machine.service" x-text="machine.service"></span></span>
              <span class="muted" x-show="$store.demo.machineChoice(machine.id).state === 'unneeded'">Not needed at this site</span>
              <span class="muted" x-show="$store.demo.machineChoice(machine.id).state === 'taken'" x-text="'On ' + $store.demo.machineChoice(machine.id).where + ' at this step'"></span>
              <span class="muted" x-show="$store.demo.machineChoice(machine.id).state === 'coming'" x-text="'Coming from ' + $store.demo.machineChoice(machine.id).where"></span>
              <span class="muted" x-show="$store.demo.draft.machineIds.includes(machine.id)">Selected</span>
            </button>
          </template>
        </div>
        <button type="button" class="primary" @click="$store.demo.goToDrivers()" :disabled="!$store.demo.draft.machineIds.length">Choose drivers</button>
      </section>
      </template>

      <template x-if="$store.demo.screen === 'drivers'">
      <section class="screen" aria-labelledby="drivers-heading">
        <button type="button" class="back" @click="$store.demo.back()">Back</button>
        <div class="screen-h">
          <p class="kicker" x-text="'4 · Driver ' + ($store.demo.draft.driverIndex + 1) + ' of ' + $store.demo.draft.machineIds.length"></p>
          <h1 id="drivers-heading" x-text="$store.demo.currentDriverMachine().name"></h1>
          <p x-text="$store.demo.currentDriverMachine().detail + ' · ' + $store.demo.draftSite().name"></p>
        </div>
        <div class="stack">
          <template x-for="person in $store.demo.operators" :key="person.id">
            <button
              type="button"
              class="tap"
              :class="{ 'is-on': $store.demo.draft.operators[$store.demo.currentDriverMachine().id] === person.id }"
              @click="$store.demo.pickDriver(person.id)"
              :disabled="$store.demo.driverChoice(person.id, $store.demo.currentDriverMachine().id).state === 'taken'"
            >
              <span class="tap-title" x-text="person.name"></span>
              <span class="muted" x-show="person.usualMachineId === $store.demo.currentDriverMachine().id">Usual operator</span>
              <span class="muted" x-show="$store.demo.driverChoice(person.id, $store.demo.currentDriverMachine().id).state === 'taken'">Already on a machine in this step</span>
              <span class="muted" x-show="$store.demo.driverChoice(person.id, $store.demo.currentDriverMachine().id).state === 'coming'" x-text="'Coming from ' + $store.demo.driverChoice(person.id, $store.demo.currentDriverMachine().id).where"></span>
            </button>
          </template>
        </div>
        <button
          type="button"
          class="primary"
          @click="$store.demo.nextDriver()"
          :disabled="!$store.demo.draft.operators[$store.demo.currentDriverMachine().id]"
          x-text="$store.demo.draft.driverIndex < $store.demo.draft.machineIds.length - 1 ? 'Next machine' : 'Review'"
        ></button>
      </section>
      </template>

      <template x-if="$store.demo.screen === 'confirm'">
      <section class="screen" aria-labelledby="confirm-heading">
        <button type="button" class="back" @click="$store.demo.back()">Back</button>
        <div class="screen-h">
          <p class="kicker">5 · Confirm</p>
          <h1 id="confirm-heading" x-text="$store.demo.draftSite().name"></h1>
          <p x-text="$store.demo.placementLabel()"></p>
        </div>
        <ul class="crew card">
          <template x-for="machineId in $store.demo.draft.machineIds" :key="machineId">
            <li>
              <strong x-text="$store.demo.machine(machineId).name"></strong>
              <span x-text="$store.demo.machine(machineId).detail"></span>
              <span x-text="$store.demo.operatorName($store.demo.draft.operators[machineId])"></span>
            </li>
          </template>
        </ul>
        <button type="button" class="primary" @click="$store.demo.addToPlan()">Add to the plan</button>
      </section>
      </template>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
